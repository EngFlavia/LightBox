<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>LightBox Mobile</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="lightbox" data-i18n-aria-label="appLabel" aria-label="Visualizador de imagens">
      <section id="viewport" class="viewport" data-i18n-aria-label="imageArea" aria-label="Área da imagem">
        <img id="image" data-i18n-alt="imageAlt" alt="Imagem selecionada" hidden>
        <p id="empty-state" class="empty-state" data-i18n="emptyState">Carregue uma imagem para começar</p>
      </section>

      <header class="topbar">
        <button id="open-button" class="icon-button" type="button" data-i18n="openImage">Carregar Imagem</button>
        <input id="file-input" type="file" accept="image/*" class="visually-hidden">
        <button id="save-button" class="icon-button" type="button" data-i18n="savePng" disabled>Salvar PNG</button>
        <button id="lock-button" class="icon-button lock-button" type="button" aria-pressed="false" aria-label="Bloquear gestos" disabled><span id="lock-label">Liberado</span></button>
        <label class="language-selector" for="language-select"><span data-i18n="language">Idioma</span><select id="language-select" aria-label="Idioma"><option value="pt">PT</option><option value="es">ES</option><option value="en">EN</option></select></label>
      </header>

      <p id="status" class="status" role="status" aria-live="polite">Nenhuma imagem carregada.</p>

      <section class="control-sheet is-collapsed" data-i18n-aria-label="transformImage" aria-label="Transformar imagem">
        <button id="transform-button" class="transform-button" type="button" aria-expanded="false" aria-controls="transform-controls" data-i18n="edit">Editar</button>
        <div id="transform-controls" class="transform-controls">
          <button id="original-button" type="button" data-i18n="original" disabled>Original</button>
          <button id="grayscale-button" type="button" aria-pressed="false" data-i18n="grayscale" disabled>Escala De Cinza</button>
          <button id="sepia-button" type="button" aria-pressed="false" data-i18n="sepia" disabled>Sépia</button>
          <div class="contrast-controls" aria-label="Contraste">
            <button id="contrast-down-button" type="button" data-i18n-aria-label="decreaseContrast" aria-label="Diminuir contraste" disabled>−</button>
            <output id="contrast-value" for="contrast-down-button contrast-up-button">Contraste 0</output>
            <button id="contrast-up-button" type="button" data-i18n-aria-label="increaseContrast" aria-label="Aumentar contraste" disabled>+</button>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
